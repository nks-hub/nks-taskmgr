name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build native core and run tests
        run: ./scripts/build.ps1 -Configuration Release -Test

      - name: Publish WinUI Native AOT application
        run: ./scripts/build.ps1 -Configuration Release -WinUI

      - name: Install Inno Setup 7.1.1
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup hash mismatch.' }
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:RUNNER_TEMP\inno" -Wait

      - name: Build installer and portable ZIP
        run: ./scripts/package.ps1 -Compiler "$env:RUNNER_TEMP\inno\ISCC.exe"

      - name: Check package version against tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: if (!(Test-Path "build/packages/NksTaskMgr-$($env:GITHUB_REF_NAME.Substring(1))-*")) { throw "Package version differs from tag $env:GITHUB_REF_NAME." }

      - uses: actions/upload-artifact@v4
        with:
          name: NksTaskMgr-win-x64
          path: build/packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NksTaskMgr-win-x64
          path: packages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
